{% extends "base.html" %}
{% block title %}Delete Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-container">
    <div class="auth-header">
      <h1 class="auth-title">Delete Expense</h1>
      <p class="auth-subtitle">This action cannot be undone</p>
    </div>
    <div class="auth-card">
      <div class="form-group">
        <label>Amount</label>
        <p class="delete-expense-value">₹{{ "%.2f"|format(expense['amount']) }}</p>
      </div>
      <div class="form-group">
        <label>Category</label>
        <p class="delete-expense-value">{{ expense['category'] }}</p>
      </div>
      <div class="form-group">
        <label>Date</label>
        <p class="delete-expense-value">{{ expense['date'] }}</p>
      </div>
      <div class="form-group">
        <label>Description</label>
        <p class="delete-expense-value">{{ expense['description'] or '—' }}</p>
      </div>
      <form method="POST" action="{{ url_for('delete_expense', id=expense['id']) }}">
        <div class="expense-form-actions">
          <button type="submit" class="btn-danger">Delete</button>
          <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
